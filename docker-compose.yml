services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vlsi-tutor-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vlsi
      POSTGRES_PASSWORD: vlsi
      POSTGRES_DB: vlsi_tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlsi -d vlsi_tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
